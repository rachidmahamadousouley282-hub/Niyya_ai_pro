name: NIYYA V2 checks

on:
  push:
    branches:
      - niyya-v2
  pull_request:
    branches:
      - niyya-v2

permissions:
  contents: read

jobs:
  test:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run engine tests
        run: npm test
