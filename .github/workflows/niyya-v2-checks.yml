name: NIYYA V2 checks

on:
  push:
    branches:
      - niyya-v2
  pull_request:
    branches:
      - niyya-v2

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src public/scripts -type f -name '*.js' -print0)
