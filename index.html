<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>NIYYA AI</title>
<style>
:root{color-scheme:dark;--bg:#050505;--surface:#111;--surface2:#141414;--line:#1f1f1f;--text:#fff;--muted:#a1a1aa;--blue:#2563eb;--blue-text:#3b82f6;--nav:56px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
main{flex:1;min-height:0;overflow-y:auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:8px}
.brand{font-weight:800;letter-spacing:.04em;font-size:19px}.brand b{color:var(--blue-text)}
.top-right{display:flex;align-items:center;gap:8px}
.lang-mini{background:var(--surface2);border:1px solid #2a2a2a;color:#fff;font-size:12px;font-weight:700;padding:4px 8px;border-radius:16px;outline:none;cursor:pointer}
.pill{font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;background:var(--blue);color:#fff}
.pill.off{background:none;border:1px solid #2a2a2a;color:var(--muted)}
input.f,textarea.f,select.f{width:100%;box-sizing:border-box;padding:12px 16px;border-radius:24px;border:1px solid #262626;background:var(--surface2);color:#fff;font:inherit;font-size:16px;outline:none}
input.f:focus,select.f:focus{border-color:var(--blue-text)}
select.f option,.lang-mini option{background:#141414;color:#fff}
.search{padding:4px 16px 10px}
.chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
.chip{flex:none;padding:8px 16px;border-radius:24px;border:1px solid #2a2a2a;background:none;color:var(--muted);font:600 14px inherit;cursor:pointer}
.chip[aria-pressed=true]{background:#fff;color:#050505;border-color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:4px 16px 16px}
.card{display:block;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.av{aspect-ratio:3/4;border-radius:14px;display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff;position:relative;overflow:hidden}
.card h3{margin:8px 0 2px;font-size:17px}
.card p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.add .av{border:1.5px dashed var(--blue);background:#0a1530;font-size:44px;color:var(--blue-text)}
nav{display:flex;height:var(--nav);border-top:1px solid var(--line);background:#0a0a0a;flex:none}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#71717a;text-decoration:none;font-size:11px;font-weight:600}
nav a[aria-current=page]{color:var(--blue-text)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex:none}
.back{color:var(--blue-text);text-decoration:none;font-weight:600;padding:8px}
.mini{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.b{max-width:84%;padding:11px 15px;border-radius:16px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--blue);border-bottom-right-radius:4px}
.a{align-self:flex-start;background:var(--surface2);border:1px solid #262626;border-bottom-left-radius:4px}
.comp{display:flex;gap:10px;padding:10px 12px 4px;flex:none}
.send{border:0;border-radius:24px;padding:0 18px;background:#fff;color:#050505;font:700 15px inherit;cursor:pointer}
.box{margin:0 16px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.box h2{margin:0;font-size:16px}.box p{margin:0;color:var(--muted);font-size:13px}
.btn{border:0;border-radius:12px;padding:12px;background:var(--blue);color:#fff;font:600 15px inherit;cursor:pointer}
.btn.ghost{background:none;border:1px solid #2a2a2a}
h1.title{margin:0;padding:14px 16px 8px;font-size:22px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav) + 16px);background:#fff;color:#050505;padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:1000}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;z-index:2000}
.sheet{width:100%;box-sizing:border-box;background:var(--surface);border-top:1px solid #2a2a2a;border-radius:20px 20px 0 0;padding:20px 16px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:18px}.sheet p{margin:0;color:var(--muted);font-size:14px}
.foot{padding:12px 16px;flex:none;display:flex;flex-direction:column;gap:10px}
.msg{font-size:13px;min-height:18px;padding:0 4px}.msg.ok{color:#4ade80}.msg.bad{color:#f87171}
label.chk{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.4}
label.chk input{width:22px;height:22px;flex:none;margin:0}
</style>
</head>
<body>
<div id="app"></div>
<script>
var CHARS = [
  { id: "clara", name: "Clara", tag: "La taquine : drôle, vive, toujours un mot d’avance.", bg: "linear-gradient(160deg,#3b82f6,#1e1b4b,#000)", hello: "Tiens, tiens… un nouveau visage. Dis-moi, tu viens souvent ici, ou c’est ma chance du jour?", replies: ["Ah, tu as de la répartie. Je commence à bien t’aimer.", "Hmm, tu essaies de m’impressionner ? Continue…"] },
  { id: "lea", name: "Léa", tag: "La complice : à l’écoute, enjouée, de ton côté.", bg: "linear-gradient(200deg,#2563eb,#09090b,#1d4ed8)", hello: "Coucou toi ! J’espérais justement qu’on vienne me parler. Comment tu te sens ?", replies: ["Je suis contente que tu sois là, vraiment."] },
  { id: "kenza", name: "Kenza", tag: "La mystérieuse : elle distille les indices au compte-gouttes.", bg: "linear-gradient(130deg,#1d4ed8,#020617,#312e81)", hello: "Tu es arrivé plus tôt que prévu… Intéressant.", replies: ["Premier indice : je ne me laisse jamais deviner."] }
];

var S = { custom: [], chats: {}, vip: false, onboarded: false, lang: "fr", country: "NE", pseudo: "", email: "", userId: null, q: { left: 5, total: 5, videos: 0, maxVideos: 5 } };
var LANGS = [["fr", "Français", "FR"], ["en", "English", "EN"], ["es", "Español", "ES"], ["ar", "العربية", "AR"], ["ja", "日本語", "JA"], ["zh", "中文", "ZH"]];

function all() { return CHARS.concat(S.custom); }
function byId(id) { return all().filter(function (c) { return c.id === id; })[0]; }
var ICONS = { home: "M3 11l9-8 9 8M5 10v10h14V10", chats: "M4 5h16v11H9l-5 4z", plus: "M12 5v14M5 12h14", user: "M12 12a4 4 0 100-8 4 4 0 000 8zM4 21c0-4 4-6 8-6s8 2 8 6" };
function Icon(name) { var ns = "http://www.w3.org/2000/svg"; var s = document.createElementNS(ns, "svg"); s.setAttribute("viewBox", "0 0 24 24"); var p = document.createElementNS(ns, "path"); p.setAttribute("d", ICONS[name]); s.appendChild(p); return s; }
function BottomNav(route) {
  var items = [["", "home", "Accueil"], ["chats", "chats", "Discussions"], ["create", "plus", "Créer"], ["settings", "user", "Réglages"]];
  return h("nav", {}, items.map(function (i) { return h("a", { href: "#/" + i[0], "aria-current": route === i[0] ? "page" : null }, Icon(i[1]), i[2]); }));
}

function TopBar() {
  var quickLang = h("select", { class: "lang-mini", onchange: function(e) { S.lang = e.target.value; Toast("Langue : " + S.lang); } },
    LANGS.map(function(l) { return h("option", { value: l[0], selected: S.lang === l[0] || null }, "🌐 " + l[2]); })
  );
  return h("div", { class: "top" }, h("div", { class: "brand" }, "NIYYA ", h("b", null, "AI")), h("div", { class: "top-right" }, quickLang, h("span", { class: "pill" + (S.vip ? "" : " off") }, S.vip ? "VIP" : (S.pseudo ? "@" + S.pseudo : "Invité"))));
}

function Avatar(c, cls) { return h("div", { class: cls, style: "background:" + c.bg }, h("span", { style: "text-shadow: 0 2px 8px rgba(0,0,0,0.8); font-weight:800;" }, c.name)); }
function CharacterCard(c) { return h("button", { class: "card", onclick: function () { location.hash = "#/chat/" + c.id; } }, Avatar(c, "av"), h("h3", null, c.name), h("p", null, c.tag)); }
function Toast(msg) { var t = h("div", { class: "toast" }, msg); document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }

function openPaywall(characterName, onReload) {
  var bg = h("div", { class: "sheet-bg" }, h("div", { class: "sheet" }, h("h2", null, "Continue avec " + characterName), h("p", null, "Messages épuisés. Regarde une vidéo ou passe au VIP !"), h("button", { class: "btn", onclick: async function() {
    try {
      let res = await fetch('/api/reward-video', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({userId: S.userId}) });
      let data = await res.json();
      if(data.messages_left !== undefined) { S.q.left = data.messages_left; Toast("+5 messages !"); bg.remove(); if(onReload) onReload(); }
      else { Toast(data.error || "Erreur"); }
    } catch(e) { Toast("Erreur réseau"); }
  }}, "Regarder une vidéo (+5 messages)"), h("button", { class: "btn ghost", onclick: function() { S.vip = true; Toast("Pass VIP activé !"); bg.remove(); if(onReload) onReload(); }}, "Passer VIP (4,99 € / mois)"), h("button", { class: "btn ghost", style: "border:none; color:var(--muted)", onclick: function() { bg.remove(); } }, "Fermer")));
  document.body.appendChild(bg);
}

function Onboarding() {
  var wrap = h("div", { style: "flex:1;display:flex;flex-direction:column;min-height:0" });
  function splash() {
    wrap.replaceChildren(h("div", { style: "margin:auto;text-align:center" }, h("div", { class: "brand", style: "font-size:36px" }, "NIYYA ", h("b", null, "AI"))));
    setTimeout(async function() {
      try {
        let res = await fetch('/api/guest', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({country: S.country, lang: S.lang}) });
        let data = await res.json();
        S.userId = data.id; S.q.left = data.messages_left;
      } catch(e) {}
      stepAuthChoice();
    }, 1500);
  }
  function stepAuthChoice() {
    wrap.replaceChildren(h("div", { style: "margin:auto;text-align:center;padding:20px;width:100%;max-width:380px" }, h("div", { class: "brand", style: "font-size:32px;margin-bottom:10px" }, "NIYYA ", h("b", null, "AI")), h("p", { style: "color:var(--muted);margin-bottom:30px" }, "Ton compagnon IA intelligent."), h("button", { class: "btn", style: "margin-bottom:12px", onclick: stepRegister }, "Créer un compte"), h("button", { class: "btn ghost", onclick: stepLogin }, "Se connecter")));
  }
  function stepRegister() {
    var pseudo = h("input", { class: "f", placeholder: "Ton pseudo (@)", maxlength: "20" });
    var email = h("input", { class: "f", type: "email", placeholder: "Ton e-mail" });
    var adult = h("input", { type: "checkbox" });
    var msg = h("div", { class: "msg" });
    wrap.replaceChildren(h("h1", { class: "title" }, "Inscription"), h("div", { style: "flex:1;padding:0 16px;display:flex;flex-direction:column;gap:12px" }, pseudo, email, h("label", { class: "chk" }, adult, "J'ai 18 ans ou plus."), msg), h("div", { class: "foot" }, h("button", { class: "btn", onclick: async function() {
      let p = pseudo.value.trim(), e = email.value.trim();
      if(!p || !e || !adult.checked) { msg.className="msg bad"; msg.textContent="Remplis tout et confirme l'âge."; return; }
      S.pseudo = p; S.email = e;
      await fetch('/api/auth/send-code', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email: e}) });
      stepCodeVerification(e);
    }}, "Recevoir mon code"), h("button", { class: "btn ghost", onclick: stepAuthChoice }, "Retour")));
  }
  function stepLogin() {
    var email = h("input", { class: "f", type: "email", placeholder: "Ton e-mail" });
    var msg = h("div", { class: "msg" });
    wrap.replaceChildren(h("h1", { class: "title" }, "Connexion"), h("div", { style: "flex:1;padding:0 16px;display:flex;flex-direction:column;gap:12px" }, email, msg), h("div", { class: "foot" }, h("button", { class: "btn", onclick: async function() {
      let e = email.value.trim();
      if(!e) return;
      S.email = e; S.pseudo = e.split("@")[0];
      await fetch('/api/auth/send-code', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email: e}) });
      stepCodeVerification(e);
    }}, "Envoyer le code"), h("button", { class: "btn ghost", onclick: stepAuthChoice }, "Retour")));
  }
  function stepCodeVerification(mail) {
    var code = h("input", { class: "f", type: "text", inputmode: "numeric", maxlength: "6", placeholder: "Code à 6 chiffres" });
    var msg = h("div", { class: "msg" });
    wrap.replaceChildren(h("h1", { class: "title" }, "Vérification"), h("div", { style: "flex:1;padding:0 16px;display:flex;flex-direction:column;gap:12px" }, code, msg), h("div", { class: "foot" }, h("button", { class: "btn", onclick: async function() {
      let c = code.value.trim();
      let res = await fetch('/api/auth/verify', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email: mail, code: c, pseudo: S.pseudo, country: S.country, lang: S.lang, guestId: S.userId}) });
      let data = await res.json();
      if(data.id) { S.userId = data.id; S.q.left = data.messages_left; S.onboarded = true; location.hash = "#/"; route(); }
      else { msg.className="msg bad"; msg.textContent=data.error || "Code invalide"; }
    }}, "Valider")));
  }
  splash();
  return wrap;
}

function HomeScreen() {
  var grid = h("div", { class: "grid" });
  all().forEach(function(c) { grid.append(CharacterCard(c)); });
  return h("main", null, TopBar(), h("h1", { class: "title" }, "Personnages"), grid);
}

function ChatScreen(id) {
  var c = byId(id);
  if (!c) { location.hash = "#/"; return h("main"); }
  if (!S.chats[id]) S.chats[id] = [{ from: "a", text: c.hello }];
  var msgs = h("div", { class: "msgs" });
  var input = h("input", { class: "f", type: "text", placeholder: "Écris..." });
  var send = h("button", { class: "send", type: "button" }, "↑");

  function bubble(m) { return h("div", { class: "b " + (m.from === "u" ? "u" : "a") }, m.text); }
  S.chats[id].forEach(function (m) { msgs.append(bubble(m)); });

  async function go() {
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    S.chats[id].push({ from: "u", text: text }); msgs.append(bubble({ from: "u", text: text }));

    try {
      let res = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({userId: S.userId, characterId: c.id, characterName: c.name, characterTag: c.tag, message: text, lang: S.lang}) });
      let data = await res.json();
      if(data.reply) {
        S.chats[id].push({ from: "a", text: data.reply });
        msgs.append(bubble({ from: "a", text: data.reply }));
        S.q.left = data.messages_left;
      } else if(data.error === "QUOTA_EXCEEDED") {
        openPaywall(c.name, function() {});
      }
    } catch(e) { Toast("Erreur de communication"); }
  }

  send.addEventListener("click", go);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });

  return [
    h("div", { class: "chat-head" }, h("a", { class: "back", href: "#/" }, "←"), Avatar(c, "mini"), h("strong", null, c.name)),
    msgs, h("div", { class: "comp" }, input, send)
  ];
}

function SettingsScreen() {
  return h("main", null, h("h1", { class: "title" }, "Réglages"), h("div", { class: "box" }, h("h2", null, "Compte"), h("p", null, "Email : " + (S.email || "Invité"))));
}

function h(tag, attrs) {
  var e = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (k === "class") e.className = v;
    else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
    else if (v != null) e.setAttribute(k, v);
  });
  Array.prototype.slice.call(arguments, 2).forEach(function add(c) {
    if (Array.isArray(c)) c.forEach(add);
    else if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  });
  return e;
}

function route() {
  var app = document.getElementById("app");
  var parts = location.hash.replace(/^#\/?/, "").split("/");
  if (!S.onboarded) { app.replaceChildren(Onboarding()); return; }
  var out = parts[0] === "chat" ? ChatScreen(parts[1]) : HomeScreen();
  app.replaceChildren(out, BottomNav(parts[0]));
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
