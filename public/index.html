<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIYYA AI - Application Officielle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #1e293b;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        h1 {
            color: #38bdf8;
            font-size: 1.25rem;
        }
        .admin-link {
            background: #334155;
            color: #f8fafc;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .admin-link:hover {
            background: #475569;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            overflow: hidden;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 20px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 75%;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user {
            background: #3b82f6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.ai {
            background: #1e293b;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }
        .input-form {
            display: flex;
            gap: 10px;
            background: #1e293b;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            padding: 8px;
            outline: none;
        }
        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>

    <header>
        <h1>🤖 NIYYA AI</h1>
        <a href="/admin" class="admin-link">🔑 Dashboard Admin</a>
    </header>

    <div class="chat-container">
        <div class="messages" id="chatMessages">
            <div class="message ai">Bonjour ! Je suis NIYYA AI. Comment puis-je t'aider aujourd'hui ?</div>
        </div>
        
        <form class="input-form" id="chatForm">
            <input type="text" id="userInput" placeholder="Écris ton message ici..." autocomplete="off" required>
            <button type="submit">Envoyer</button>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const chatMessages = document.getElementById('chatMessages');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            // Ajouter le message de l'utilisateur à l'écran
            appendMessage(text, 'user');
            userInput.value = '';

            // Simulation de réponse de l'IA (tu pourras brancher ton endpoint backend ici)
            setTimeout(() => {
                appendMessage("J'ai bien reçu ton message ! Le système fonctionne à merveille.", 'ai');
            }, 600);
        });

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>

</body>
</html>
